[env:atom-gotchi]
platform = espressif32
board = m5stack-atoms3
framework = arduino
; Dos particiones de app (OTA) en los 8 MB de flash
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified@^0.2.2

; USB-CDC: sin esto Serial no sale por el puerto USB nativo del S3
build_flags =
    -DARDUINO_M5Stack_ATOM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Actualizar por WiFi:  OTA_PASS=<contraseña de credentials.h> pio run -e atom-gotchi-ota -t upload
[env:atom-gotchi-ota]
extends = env:atom-gotchi
upload_protocol = espota
upload_port = atom-gotchi.local
upload_flags = --auth=${sysenv.OTA_PASS}

; Pantalla de depuración del botón desde el arranque (también se alterna con 'x' por serie)
[env:atom-gotchi-btn]
extends = env:atom-gotchi
build_flags =
    ${env:atom-gotchi.build_flags}
    -DBUTTON_DEBUG

[env:atom-gotchi-btn-ota]
extends = env:atom-gotchi-btn
upload_protocol = espota
upload_port = atom-gotchi.local
upload_flags = --auth=${sysenv.OTA_PASS}
