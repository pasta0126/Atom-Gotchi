[env:atom-gotchi]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified@^0.2.2

; USB-CDC: sin esto Serial no sale por el puerto USB nativo del S3
build_flags =
    -DARDUINO_M5Stack_ATOM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17

build_unflags =
    -std=gnu++11
