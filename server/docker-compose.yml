name: atom-gotchi

services:
  atom-api:
    build: .
    image: atom-api:latest
    container_name: atom-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atom-api.rule=Host(`atom-api.northernarchive.com`)"
      - "traefik.http.routers.atom-api.entrypoints=websecure"
      - "traefik.http.routers.atom-api.tls.certresolver=le"
      - "traefik.http.services.atom-api.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
